name: Backend CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The wrapper is tracked without the executable bit; keep this step so
      # `./mvnw` works on a clean checkout without changing that file.
      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # GitHub-hosted ubuntu runners include Docker, which Testcontainers uses
      # to start the MongoDB replica set required by the integration tests.
      - name: Verify Docker is available
        run: docker info

      - name: Compile
        run: ./mvnw -B -q -DskipTests compile

      - name: Run tests
        run: ./mvnw -B test

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
